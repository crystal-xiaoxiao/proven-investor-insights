<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proven Investor Insights</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ink: #1A1A1A;
    --navy: #1E3A5F;
    --tint: #F2F5F9;
    --rule: #E5E5E5;
    --gray: #707070;
    --font: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.75;
  }
  a { color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--rule); }
  a:hover, a:focus-visible { border-bottom-color: var(--navy); outline: none; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

  header { border-bottom: 1px solid var(--rule); }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 36px 0 18px; flex-wrap: wrap; }
  .masthead h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
  .masthead .period { color: var(--gray); font-size: 13px; }
  .masthead .owner { color: var(--gray); font-size: 13px; }

  nav.tabs { display: flex; gap: 28px; }
  nav.tabs button {
    appearance: none; background: none; border: 0; padding: 10px 0 12px; margin: 0;
    font: inherit; font-size: 15px; color: var(--gray); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--navy); font-weight: 600; }

  main { padding: 28px 0 80px; }
  .panel[hidden] { display: none; }

  /* 本期摘要 */
  .summary { background: var(--tint); padding: 22px 26px; margin: 0 0 36px; font-size: 17px; line-height: 1.8; max-width: 820px; }
  .summary p { margin: 0; }
  .summary .label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 6px; }

  /* 两栏 */
  .cols { display: grid; grid-template-columns: 200px 1fr; gap: 48px; align-items: start; }
  .index { position: sticky; top: 24px; }
  .index ol { list-style: none; margin: 0; padding: 0; }
  .index li { padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .index li a { border: 0; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ink); }
  .index li a .n { color: var(--gray); font-size: 12px; }
  .index li a.quiet { color: var(--gray); }

  .investor { padding: 26px 0 30px; border-bottom: 1px solid var(--rule); scroll-margin-top: 20px; }
  .investor:first-child { padding-top: 0; }
  .investor h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .investor .firm { color: var(--gray); font-size: 13px; margin-bottom: 14px; }
  .empty { color: var(--gray); font-size: 14px; }

  .view { margin: 18px 0 0; max-width: 720px; }
  .view + .view { padding-top: 18px; border-top: 1px dashed var(--rule); }
  .view .meta { font-size: 13px; color: var(--gray); margin-bottom: 4px; }
  .view .meta a { color: var(--gray); }
  .view h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .view ul { margin: 0; padding-left: 18px; }
  .view li { margin: 4px 0; }
  .view .orig { color: var(--gray); font-size: 13px; margin-top: 8px; }
  .view .topics { margin-top: 8px; font-size: 12px; color: var(--navy); }
  .view .topics span { background: var(--tint); padding: 2px 8px; margin-right: 6px; }

  /* 过往业绩：投资人 × 浪潮 */
  .grid-wrap { overflow-x: auto; }
  table.waves { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px; }
  table.waves th, table.waves td { text-align: left; vertical-align: top; padding: 12px 14px 12px 0; border-bottom: 1px solid var(--rule); }
  table.waves thead th { color: var(--gray); font-weight: 400; font-size: 13px; padding-top: 4px; }
  table.waves th.who { font-weight: 600; white-space: nowrap; width: 150px; }
  table.waves th.who small { display: block; color: var(--gray); font-weight: 400; font-size: 12px; }
  table.waves td .yr { display: block; color: var(--gray); font-size: 12px; }
  table.waves td.none { color: var(--rule); }
  .notice { color: var(--gray); font-size: 13px; margin: 18px 0 0; }

  /* 往期 */
  .history { list-style: none; margin: 0; padding: 0; max-width: 720px; }
  .history li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .history li a { border: 0; font-weight: 600; }
  .history li .s { color: var(--gray); font-size: 13px; margin-top: 2px; }
  .history-back { margin-bottom: 20px; }
  .history-back button { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--navy); cursor: pointer; border-bottom: 1px solid var(--rule); }

  footer { border-top: 1px solid var(--rule); color: var(--gray); font-size: 12px; padding: 18px 0 40px; }

  @media (max-width: 760px) {
    .wrap { padding: 0 18px; }
    .cols { grid-template-columns: 1fr; gap: 24px; }
    .index { position: static; }
    .index ol { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .index li { border: 0; padding: 0; }
    .index li a .n { display: none; }
    .masthead { padding-top: 26px; }
    .summary { font-size: 16px; padding: 18px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="masthead">
      <div>
        <h1 id="title">Proven Investor Insights</h1>
        <div class="period" id="period"></div>
      </div>
      <div class="owner" id="owner"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="视图">
      <button role="tab" aria-selected="true" aria-controls="p-latest" data-tab="latest">本期观点</button>
      <button role="tab" aria-selected="false" aria-controls="p-record" data-tab="record">过往业绩记录</button>
      <button role="tab" aria-selected="false" aria-controls="p-history" data-tab="history">往期</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-latest" role="tabpanel">
    <div class="summary" id="summary"></div>
    <div class="cols">
      <aside class="index"><ol id="index"></ol></aside>
      <div id="latest"></div>
    </div>
  </section>

  <section class="panel" id="p-record" role="tabpanel" hidden>
    <div class="grid-wrap"><table class="waves" id="waves"></table></div>
    <p class="notice" id="notice"></p>
  </section>

  <section class="panel" id="p-history" role="tabpanel" hidden>
    <div id="history"></div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (d) => d ? d.replace(/-/g, '.') : '';

  // 标签切换
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.panel').forEach(p => p.hidden = (p.id !== 'p-' + b.dataset.tab));
    history.replaceState(null, '', '#' + b.dataset.tab);
  }));
  const initial = location.hash.replace('#', '');
  if (['record', 'history'].includes(initial)) document.querySelector(`[data-tab="${initial}"]`).click();

  let data;
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $('#summary').innerHTML = '<p>没有读到 data.json。如果是本地打开，请用本地服务器（如 <code>python -m http.server</code>）或直接访问 GitHub Pages 地址。</p>';
    return;
  }

  const m = data.meta || {};
  $('#title').textContent = m.title || 'Proven Investor Insights';
  $('#period').textContent = `观察窗口 ${fmt(m.window_start)} 至 ${fmt(m.window_end)}，更新于 ${fmt(m.last_updated)}`;
  $('#owner').textContent = m.owner || '';
  $('#foot').textContent = `每两周由自动任务更新。所有观点均附原始出处；未找到公开发言的投资人标注“本期无新增”，不做补写。`;

  // 本期摘要
  $('#summary').innerHTML = `<span class="label">本期摘要</span><p>${esc(m.period_summary || '')}</p>`;

  // 本期观点
  renderLatest(data.investors, $('#latest'), $('#index'));

  function renderLatest(investors, mount, indexMount) {
    if (indexMount) indexMount.innerHTML = investors.map(iv => {
      const n = (iv.latest || []).length;
      return `<li><a href="#iv-${esc(iv.id)}" class="${n ? '' : 'quiet'}">${esc(iv.name)}<span class="n">${n ? n + ' 条' : '无'}</span></a></li>`;
    }).join('');

    mount.innerHTML = investors.map(iv => {
      const items = iv.latest || [];
      const body = items.length ? items.map(v => `
        <article class="view">
          <div class="meta">${esc(fmt(v.date))}，${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.source_label || v.source_type || '来源')}</a>` : esc(v.source_label || '')}</div>
          <h3>${esc(v.headline)}</h3>
          ${(v.points && v.points.length) ? `<ul>${v.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
          ${v.original ? `<div class="orig">原文：${esc(v.original)}</div>` : ''}
          ${(v.topics && v.topics.length) ? `<div class="topics">${v.topics.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        </article>`).join('')
      : `<div class="empty">本期无新增公开发言（观察窗口内未检索到播客、X、Substack 或媒体专访）。</div>`;
      return `<section class="investor" id="iv-${esc(iv.id)}">
        <h2>${esc(iv.name)}</h2>
        <div class="firm">${esc(iv.firm || '')}</div>
        ${body}
      </section>`;
    }).join('');
  }

  // 过往业绩记录：投资人 × 浪潮
  const waves = data.waves || [];
  const thead = `<thead><tr><th class="who"></th>${waves.map(w => `<th>${esc(w.label)}</th>`).join('')}</tr></thead>`;
  const rows = data.investors.map(iv => {
    const cells = waves.map(w => {
      const hits = (iv.track_record || []).filter(t => t.wave === w.id);
      if (!hits.length) return `<td class="none">—</td>`;
      return `<td>${hits.map(t => `${esc(t.bet)}<span class="yr">${esc(t.year || '')}</span>`).join('<br>')}</td>`;
    }).join('');
    return `<tr><th class="who">${esc(iv.name)}<small>${esc(iv.firm || '')}</small></th>${cells}</tr>`;
  }).join('');
  $('#waves').innerHTML = thead + `<tbody>${rows}</tbody>`;
  $('#notice').textContent = m.notice || '';

  // 往期
  const hm = $('#history');
  try {
    const r = await fetch('history/index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const list = await r.json();
    if (!list.length) throw new Error('empty');
    hm.innerHTML = `<ul class="history">${list.map(h => `<li><a href="#" data-file="${esc(h.file)}">${esc(fmt(h.window_start))} 至 ${esc(fmt(h.window_end))}</a><div class="s">${esc(h.period_summary || '')}</div></li>`).join('')}</ul>`;
    hm.querySelectorAll('a[data-file]').forEach(a => a.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const snap = await (await fetch('history/' + a.dataset.file, { cache: 'no-store' })).json();
      const listHtml = hm.innerHTML;
      hm.innerHTML = `<div class="history-back"><button type="button">返回往期列表</button></div>
        <div class="summary"><span class="label">${esc(fmt(snap.meta.window_start))} 至 ${esc(fmt(snap.meta.window_end))}</span><p>${esc(snap.meta.period_summary || '')}</p></div>
        <div id="snap"></div>`;
      renderLatest(snap.investors, hm.querySelector('#snap'), null);
      hm.querySelector('button').addEventListener('click', () => { hm.innerHTML = listHtml; hm.querySelectorAll('a[data-file]').forEach(x => x.addEventListener('click', () => location.reload())); });
    }));
  } catch (e) {
    hm.innerHTML = `<div class="empty">还没有往期记录。第二次更新后，上一期会自动归档到这里。</div>`;
  }
})();
</script>
</body>
</html>
